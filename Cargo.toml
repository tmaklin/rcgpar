[package]
name = "rcgpar"
version = "0.1.0"
edition = "2024"
authors = [
    "Tommi Mäklin <tommi@maklin.fi>",
    "Jarno N. Alanko <alanko.jarno@gmail.com>",
    "Joel Pietiläinen <joel.pietilainen@helsinki.fi>",
]
description = "Riemannian conjugate gradient descent for estimating mixture model weights."
readme = "README.md"
homepage = "https://github.com/tmaklin/rcgpar"
repository = "https://github.com/tmaklin/rcgpar"
license = "LGPL-2.1-or-later"

[features]
cxxbridge = ["dep:cxx", "dep:cxx-build"]
wgpu = ["burn/wgpu"]
webgpu = ["burn/webgpu"]
vulkan = ["burn/vulkan"]

[dependencies]
## Core
burn = { version = "0.19", default-features = false, features = ["ndarray"] }
burn-tensor = "0.19"
num = "0.4"

## CLI
clap = { version = "4", features = ["derive"]}
csv = "1.3.0"
log = "0.4.20"
stderrlog = "0.6.0"

## C++ API
cxx = { version = "1.0", optional = true }

[build-dependencies]
cxx-build = { version = "1.0", optional = true }

[dev-dependencies]
assert_approx_eq = "1.1"
statrs = "0.18"
